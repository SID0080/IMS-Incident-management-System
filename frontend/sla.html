<script>
    // ── Per-tab session isolation ─────────────────────────────
    // sessionStorage is scoped to a single tab, so different tabs can be
    // signed in as different users at the same time — useful for demos.
    // We shim just the two IMS auth keys; everything else on localStorage
    // still works normally.
    (function () {
        const KEYS = new Set(['ims_token', 'ims_user']);
        const _get = localStorage.getItem.bind(localStorage);
        const _set = localStorage.setItem.bind(localStorage);
        const _del = localStorage.removeItem.bind(localStorage);
        localStorage.getItem    = k => KEYS.has(k) ? sessionStorage.getItem(k)      : _get(k);
        localStorage.setItem    = (k, v) => KEYS.has(k) ? sessionStorage.setItem(k, v) : _set(k, v);
        localStorage.removeItem = k => KEYS.has(k) ? sessionStorage.removeItem(k)   : _del(k);
    })();
</script>

<script>
    // ── Auth guard (runs before any other script on this page) ─────
    (function () {
        const token = localStorage.getItem('ims_token');
        const userStr = localStorage.getItem('ims_user');

        if (!token || !userStr) {
            window.location.replace('login.html');
            return;
        }

        // JWT expiry check — decode the payload without needing a library
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.exp && payload.exp * 1000 < Date.now()) {
                localStorage.removeItem('ims_token');
                localStorage.removeItem('ims_user');
                window.location.replace('login.html?expired=1');
                return;
            }
        } catch (e) {
            // Malformed token → force re-login
            localStorage.removeItem('ims_token');
            localStorage.removeItem('ims_user');
            window.location.replace('login.html');
            return;
        }

        // Role gate — set inside each page's script tag via <body data-requires-role="MANAGER,ADMIN">
        const user = JSON.parse(userStr);
        const requires = document.body.getAttribute('data-requires-role');
        if (requires) {
            const allowed = requires.split(',').map(s => s.trim());
            if (!allowed.includes(user.role)) {
                window.location.replace('dashboard.html?denied=1');
                return;
            }
        }
    })();
</script>

<script>
const API = 'http://localhost:8000';
const token = localStorage.getItem('token') || localStorage.getItem('ims_token');
const headers = { 'Authorization': `Bearer ${token}` };

let allTickets = [];
let activeRiskFilter = 'all';
let tickerInterval = null;

// ── Fetch data ────────────────────────────────────────────
async function fetchAndRender() {
    try {
        const [slaRes, dashRes] = await Promise.all([
            fetch(`${API}/sla/status`, { headers }),
            fetch(`${API}/admin/sla-dashboard`, { headers }),
        ]);
        if (slaRes.status === 401 || slaRes.status === 403) {
            throw new Error('AUTH');
        }
        if (!slaRes.ok) throw new Error('SLA fetch failed');

        const sla  = await slaRes.json();
        const dash = dashRes.ok ? await dashRes.json() : null;

        allTickets = sla.tickets;
        updateSummaryCards(sla);
        renderCards();
        if (dash) renderDeptTable(dash.by_department);

        document.getElementById('last-sync').textContent = `Last synced: ${new Date().toLocaleTimeString()}`;
        document.getElementById('live-dot').className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block';

        // Start client-side tick (decrement timers every second between API refreshes)
        startTicker();
    } catch(e) {
        const isAuth = e.message === 'AUTH';
        document.getElementById('last-sync').textContent = isAuth ? 'Access denied' : 'API offline';
        document.getElementById('live-dot').className = 'w-1.5 h-1.5 rounded-full bg-red-400 inline-block';
        document.getElementById('sla-grid').innerHTML = `<div class="col-span-full text-center py-16 text-slate-400">
            <i class="fa-solid fa-${isAuth ? 'lock' : 'server'} text-3xl mb-3 block opacity-40"></i>
            <p class="text-sm font-semibold">${isAuth ? 'Access denied' : 'Cannot reach the server'}</p>
            <p class="text-xs mt-1">${isAuth
                ? 'The SLA Dashboard is available to managers and admins. Log in with a manager or admin account.'
                : 'Check that the backend is running at ' + API}</p></div>`;
    }
}

// ── Client-side countdown tick ────────────────────────────
function startTicker() {
    if (tickerInterval) clearInterval(tickerInterval);
    tickerInterval = setInterval(() => {
        allTickets.forEach(t => {
            // Paused tickets have a frozen SLA clock — never decrement them.
            if (t.time_remaining_seconds !== null && t.risk_level !== 'paused') t.time_remaining_seconds -= 1;
        });
        updateCountdownDisplays();
    }, 1000);
}

// ── Only update countdown displays without full re-render ─
function updateCountdownDisplays() {
    allTickets.forEach(t => {
        const el = document.getElementById(`countdown-${t.id}`);
        if (el) el.textContent = formatTime(t.time_remaining_seconds);
        const ring = document.getElementById(`ring-${t.id}`);
        if (ring) {
            const pct = Math.max(0, t.pct_remaining ?? 0);
            const circ = 2 * Math.PI * 22;
            ring.style.strokeDashoffset = circ * (1 - pct);
        }
    });
}

// ── Summary cards ─────────────────────────────────────────
function updateSummaryCards(sla) {
    document.getElementById('s-active').textContent   = sla.total_active;
    document.getElementById('s-safe').textContent     = sla.safe;
    document.getElementById('s-risk').textContent     = sla.warning + sla.danger;
    document.getElementById('s-breached').textContent = sla.breached;
}

// ── Filter ────────────────────────────────────────────────
function setRiskFilter(risk, btn) {
    activeRiskFilter = risk;
    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.add('text-slate-500');
    });
    btn.classList.add('active');
    btn.classList.remove('text-slate-500');
    renderCards();
}

// ── Render SLA cards ──────────────────────────────────────
function renderCards() {
    const dept = document.getElementById('dept-filter').value;
    const terminal = document.getElementById('terminal-filter').value;
    let tickets = allTickets;
    if (activeRiskFilter !== 'all') tickets = tickets.filter(t => t.risk_level === activeRiskFilter);
    if (dept) tickets = tickets.filter(t => t.category === dept);
    if (terminal) tickets = tickets.filter(t => t.terminal === terminal);

    const grid = document.getElementById('sla-grid');
    if (!tickets.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400">
            <i class="fa-solid fa-circle-check text-3xl mb-3 block text-emerald-400/50"></i>
            <p class="text-sm font-medium">No tickets match this filter</p></div>`;
        return;
    }

    grid.innerHTML = tickets.map(t => buildCard(t)).join('');
}

function buildCard(t) {
    const risk       = t.risk_level;
    const remaining  = t.time_remaining_seconds ?? 0;
    const pct        = Math.max(0, Math.min(1, t.pct_remaining ?? 0));
    const circ       = 2 * Math.PI * 22;   // circumference for r=22
    const offset     = circ * (1 - pct);

    const RING_COLOR = { safe: '#10b981', warning: '#f59e0b', danger: '#f97316', breached: '#ef4444', paused: '#94a3b8' };
    const TRACK_COLOR= { safe: '#d1fae5', warning: '#fef3c7', danger: '#ffedd5', breached: '#fee2e2', paused: '#e2e8f0' };
    const CARD_ANIM  = risk === 'breached' ? 'risk-breached' : risk === 'danger' ? 'risk-danger' : '';

    const priorityBadge = {
        critical: 'bg-red-100 text-red-600 border-red-200',
        high:     'bg-orange-100 text-orange-600 border-orange-200',
        medium:   'bg-amber-100 text-amber-600 border-amber-200',
        low:      'bg-slate-100 text-slate-600 border-slate-200',
    }[t.priority] || 'bg-slate-100 text-slate-600 border-slate-200';

    const statusLabel = risk === 'paused'
        ? { text: '⏸ Paused', cls: 'bg-slate-100 text-slate-600 border-slate-200' }
        : ({
            in_progress:     { text: 'In Progress', cls: 'bg-purple-50 text-purple-600 border-purple-200' },
            critical_review: { text: 'Critical Review', cls: 'bg-red-50 text-red-600 border-red-200' },
        }[t.status] || { text: t.status, cls: 'bg-slate-50 text-slate-600 border-slate-200' });

    const countdownColor = risk === 'breached' ? 'text-red-600'
        : risk === 'danger' ? 'text-orange-600'
        : risk === 'warning' ? 'text-amber-600'
        : risk === 'paused' ? 'text-slate-500'
        : 'text-emerald-600';

    const countdownLabel = risk === 'breached' ? 'OVERDUE'
        : risk === 'paused' ? 'PAUSED'
        : 'remaining';

    return `
    <div class="sla-card ${CARD_ANIM} bg-white rounded-2xl p-5 shadow-soft border-2">
        <div class="flex items-start justify-between gap-3 mb-4">
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1.5">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase border ${priorityBadge}">${t.priority}</span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase border ${statusLabel.cls}">${statusLabel.text}</span>
                </div>
                <p class="font-semibold text-navy-900 text-sm truncate">${t.title}</p>
                <p class="text-xs text-slate-400 mt-0.5">${t.ticket_number ? '<span class="font-mono font-bold text-slate-500">#'+t.ticket_number+'</span> · ' : ''}${formatCategory(t.category)}${t.terminal ? ' · <span class="font-semibold text-brand-blue">'+t.terminal+'</span>' : ''} ${t.location ? '· ' + t.location : ''}</p>
            </div>

            <!-- Countdown ring -->
            <div class="flex-shrink-0 flex flex-col items-center">
                <svg width="54" height="54" viewBox="0 0 54 54">
                    <circle class="ring-track countdown-ring" cx="27" cy="27" r="22"
                        stroke="${TRACK_COLOR[risk]}" />
                    <circle id="ring-${t.id}" class="ring-fill countdown-ring" cx="27" cy="27" r="22"
                        stroke="${RING_COLOR[risk]}"
                        stroke-dasharray="${circ}"
                        stroke-dashoffset="${offset}" />
                </svg>
                <p id="countdown-${t.id}" class="text-xs font-bold mt-1 ${countdownColor}">
                    ${formatTime(remaining)}
                </p>
                <p class="text-[9px] text-slate-400 uppercase tracking-wider">${countdownLabel}</p>
            </div>
        </div>

        <div class="border-t border-slate-100 pt-3 flex items-center justify-between">
            <div class="flex items-center gap-2 flex-wrap">
                ${t.assignee_name
                    ? `<div class="w-6 h-6 rounded-lg bg-navy-900 flex items-center justify-center flex-shrink-0">
                           <span class="text-white text-[10px] font-bold">${t.assignee_name.charAt(0)}</span>
                       </div>
                       <span class="text-xs text-slate-600 font-medium">${t.assignee_name}</span>
                       ${(() => { try { const extra = JSON.parse(t.additional_assignee_ids || '[]'); return extra.length > 0 ? `<span class="text-[10px] font-bold bg-blue-50 text-brand-blue border border-blue-200 px-1.5 py-0.5 rounded-full">+${extra.length} more</span>` : ''; } catch(e) { return ''; } })()} `
                    : `<span class="text-xs text-red-500 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Unassigned</span>`
                }
            </div>
            <span class="text-[10px] text-slate-400">${t.sla_deadline ? new Date(t.sla_deadline).toLocaleTimeString() : 'No deadline'}</span>
        </div>
    </div>`;
}

// ── Department table ──────────────────────────────────────
function renderDeptTable(byDept) {
    const tbody = document.getElementById('dept-table');
    const entries = Object.entries(byDept);
    if (!entries.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400 text-sm">No active tickets.</td></tr>`;
        return;
    }

    tbody.innerHTML = entries.map(([dept, stats]) => {
        const rate    = Math.round(stats.breach_rate * 100);
        const barColor= rate >= 75 ? 'bg-red-500' : rate >= 40 ? 'bg-amber-500' : 'bg-emerald-500';
        const rateColor= rate >= 75 ? 'text-red-600 font-bold' : rate >= 40 ? 'text-amber-600 font-semibold' : 'text-emerald-600';
        return `<tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
            <td class="px-6 py-4 font-semibold text-navy-900">${formatCategory(dept)}</td>
            <td class="px-6 py-4 text-slate-600">${stats.total}</td>
            <td class="px-6 py-4 text-slate-600">${stats.breached}</td>
            <td class="px-6 py-4 ${rateColor}">${rate}%</td>
            <td class="px-6 py-4 w-40">
                <div class="w-full bg-slate-100 rounded-full h-2">
                    <div class="${barColor} h-2 rounded-full transition-all" style="width:${rate}%"></div>
                </div>
            </td>
        </tr>`;
    }).join('');
}

// ── Format seconds → HH:MM:SS or +HH:MM:SS if overdue ────
function formatTime(secs) {
    if (secs === null || secs === undefined) return 'N/A';
    const abs = Math.abs(secs);
    const h   = Math.floor(abs / 3600);
    const m   = Math.floor((abs % 3600) / 60);
    const s   = abs % 60;
    const str = [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
    return secs < 0 ? `+${str}` : str;
}

// Initial load + auto-refresh every 60s
fetchAndRender();
setInterval(fetchAndRender, 60000);

// ── Category display formatter ────────────────────────────
// Converts raw API values to clean display labels.
// "it" → "IT"  |  "technical_operations" → "Technical Operations"
function formatCategory(cat) {
    if (!cat) return 'Uncategorized';
    const map = {
        'it':                   'IT',
        'hr':                   'HR',
        'security':             'Security',
        'technical_operations': 'Technical Operations',
        'marketing':            'Marketing',
        'legal':                'Legal',
    };
    return map[cat.toLowerCase()] ||
           cat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
