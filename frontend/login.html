<script>
    // ── Per-tab session isolation ─────────────────────────────
    // sessionStorage is scoped to a single tab, so different tabs can be
    // signed in as different users at the same time — useful for demos.
    // We shim just the two IMS auth keys; everything else on localStorage
    // still works normally.
    (function () {
        const KEYS = new Set(['ims_token', 'ims_user']);
        const _get = localStorage.getItem.bind(localStorage);
        const _set = localStorage.setItem.bind(localStorage);
        const _del = localStorage.removeItem.bind(localStorage);
        localStorage.getItem    = k => KEYS.has(k) ? sessionStorage.getItem(k)      : _get(k);
        localStorage.setItem    = (k, v) => KEYS.has(k) ? sessionStorage.setItem(k, v) : _set(k, v);
        localStorage.removeItem = k => KEYS.has(k) ? sessionStorage.removeItem(k)   : _del(k);
    })();
</script>

<script>
    const API = 'http://localhost:8000';

    // ── If already signed in, skip the login screen ────────────
    // (unless they arrived via ?expired or ?denied — those need to see why)
    (function () {
        const p = new URLSearchParams(window.location.search);
        if (!p.has('expired') && !p.has('denied')) {
            const t = localStorage.getItem('ims_token');
            if (t) {
                try {
                    const payload = JSON.parse(atob(t.split('.')[1]));
                    if (payload.exp && payload.exp * 1000 > Date.now()) {
                        window.location.replace('dashboard.html');
                        return;
                    }
                } catch (e) { /* fall through to login */ }
            }
        }
    })();

    // ── Banner for redirected sessions ─────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
        const p = new URLSearchParams(window.location.search);
        const banner = document.getElementById('login-banner');
        if (p.has('expired')) {
            banner.className = 'mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2 bg-amber-500/15 border border-amber-500/30 text-amber-200';
            banner.innerHTML = '<i class="fa-solid fa-clock"></i> Your session expired. Please sign in again.';
            banner.classList.remove('hidden');
        } else if (p.has('denied')) {
            banner.className = 'mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2 bg-red-500/15 border border-red-500/30 text-red-200';
            banner.innerHTML = '<i class="fa-solid fa-lock"></i> That page needs a manager or admin account.';
            banner.classList.remove('hidden');
        }
        // Clear localStorage on any failure landing so a stale user object doesn't hang around
        if (p.has('expired')) {
            localStorage.removeItem('ims_token');
            localStorage.removeItem('ims_user');
        }
    });

    function showAlert(text, type = 'error') {
        const el = document.getElementById('alert-msg');
        const icon = document.getElementById('alert-icon');
        document.getElementById('alert-text').textContent = text;
        el.className = 'mb-5 p-3.5 rounded-2xl text-sm flex items-center gap-2 ';
        if (type === 'success') { el.className += 'bg-emerald-500/15 border border-emerald-500/30 text-emerald-200'; icon.className = 'fa-solid fa-circle-check'; }
        else { el.className += 'bg-red-500/15 border border-red-500/30 text-red-200'; icon.className = 'fa-solid fa-circle-exclamation'; }
        el.classList.remove('hidden');
    }

    function switchTab(tab) {
        const isLogin = tab === 'login';
        document.getElementById('form-login').classList.toggle('hidden', !isLogin);
        document.getElementById('form-register').classList.toggle('hidden', isLogin);
        document.getElementById('tab-login').className = `flex-1 py-2.5 rounded-xl text-sm font-bold transition ${isLogin ? 'text-white bg-white/15' : 'text-slate-400 hover:text-white'}`;
        document.getElementById('tab-register').className = `flex-1 py-2.5 rounded-xl text-sm font-bold transition ${!isLogin ? 'text-white bg-white/15' : 'text-slate-400 hover:text-white'}`;
        document.getElementById('alert-msg').classList.add('hidden');
    }

    function togglePassword() {
        const pw = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        pw.type = pw.type === 'password' ? 'text' : 'password';
        icon.className = pw.type === 'password' ? 'fa-regular fa-eye text-sm' : 'fa-regular fa-eye-slash text-sm';
    }

    async function handleLogin() {
        const email       = document.getElementById('email').value.trim();
        const password    = document.getElementById('password').value;
        const access_code = document.getElementById('login-code').value.trim() || null;
        const btn         = document.getElementById('login-btn');

        if (!email || !password) { showAlert('Please enter your email and password.'); return; }

        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Authenticating...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API}/auth/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, access_code }),
            });
            const data = await res.json();
            if (!res.ok) {
                showAlert(data.detail || 'Invalid credentials or access code.');
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Authenticate';
                btn.disabled = false;
                return;
            }
            localStorage.setItem('token', data.access_token);
            localStorage.setItem('ims_token', data.access_token);
            localStorage.setItem('ims_user', JSON.stringify(data.user));
            localStorage.setItem('role', data.user.role);
            btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Authenticated';
            const role = data.user.role;
            const normalizedRole = typeof role === 'number' ? role : String(role).toUpperCase();
            if (normalizedRole === 'WORKER' || normalizedRole === 1 || normalizedRole === '1') {
                window.location.href = 'worker.html';
            } else if (normalizedRole === 'MANAGER' || normalizedRole === 2 || normalizedRole === '2') {
                window.location.href = 'manager.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        } catch (e) {
            showAlert('Cannot reach the server.');
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Authenticate';
            btn.disabled = false;
        }
    }

    async function handleRegister() {
        const full_name   = document.getElementById('reg-name').value.trim();
        const email       = document.getElementById('reg-email').value.trim();
        const password    = document.getElementById('reg-password').value;
        const access_code = document.getElementById('reg-code').value.trim();
        const btn         = document.getElementById('register-btn');

        if (!full_name || !email || !password) { showAlert('Please fill in all fields.'); return; }
        if (!access_code)                       { showAlert('Your personal access code is required.'); return; }

        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Verifying code...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API}/auth/register`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name, email, password, access_code }),
            });
            const data = await res.json();
            if (!res.ok) {
                showAlert(data.detail || 'Registration failed. Check your code and email.');
                btn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Create Account';
                btn.disabled = false;
                return;
            }
            const dept = (data.department || '').replace(/_/g,' ').toUpperCase();
            showAlert(`Account created as ${data.role}${dept ? ' — ' + dept : ''}. Switching to Sign In...`, 'success');
            setTimeout(() => {
                switchTab('login');
                document.getElementById('email').value = email;
                document.getElementById('login-code').value = access_code;
            }, 1800);
            btn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Create Account';
            btn.disabled = false;
        } catch (e) {
            showAlert('Cannot reach the server.');
            btn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Create Account';
            btn.disabled = false;
        }
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
