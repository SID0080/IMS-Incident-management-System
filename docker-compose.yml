version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: adani_ims_db
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       adani_ims
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adani_ims"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: adani_ims_api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - uploads:/app/uploads
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: adani_ims_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@adani.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
